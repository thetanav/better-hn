<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Better HN — A better Hacker News client</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
        <meta
            name="description"
            content="A better way to read Hacker News. Personalized rankings, trending stories, and signal tracking."
        />

        <!-- Favicon -->
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

        <!-- Open Graph -->
        <meta property="og:type" content="website" />
        <meta
            property="og:title"
            content="Better HN — A better Hacker News client"
        />
        <meta
            property="og:description"
            content="A better way to read Hacker News. Personalized rankings, trending stories, and signal tracking."
        />
        <meta
            property="og:image"
            content="https://better-hnews.vercel.app/og-image.svg"
        />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />

        <!-- Twitter Card -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta
            name="twitter:title"
            content="Better HN — A better Hacker News client"
        />
        <meta
            name="twitter:description"
            content="A better way to read Hacker News. Personalized rankings, trending stories, and signal tracking."
        />
        <meta name="twitter:image" content="/og-image.svg" />

        <!-- Theme -->
        <meta name="theme-color" content="#000000" />

        <script type="module" src="/src/main.tsx"></script>
    </head>
    <body>
        <div id="root"></div>
    </body>
</html>
